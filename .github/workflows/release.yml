name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Publish directly, or stage for npm account 2FA approval
        type: choice
        options: [publish, stage]
        default: publish

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'evan-hyer/privacy-mask-video'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run assets:prepare
      - name: Run targeted regression tests
        run: npm test
      - name: Build and inspect package
        run: |
          npm run prepack
          npm pack --ignore-scripts --json > pack.json
          node scripts/release-registry.mjs prepare
      - name: Publish and verify registry integrity
        id: registry
        env:
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
        run: node scripts/release-registry.mjs publish
      - name: Create experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_STATUS: ${{ steps.registry.outputs.status }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          archive="privacy-mask-video-$version.tgz"
          sha256sum "$archive" > "$archive.sha256"
          cp RELEASE_NOTES.md release-notes.md
          if [ "$REGISTRY_STATUS" = staged ]; then
            printf '\nNpm version %s is staged, pending maintainer 2FA approval. It is not yet installable from npm. Download the attached archive in the meantime.\n' "$version" >> release-notes.md
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$archive" "$archive.sha256" --clobber
            gh release edit "v$version" --notes-file release-notes.md
          else
            gh release create "v$version" "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" --title "v$version (experimental)" \
              --prerelease --notes-file release-notes.md
          fi

  security:
    name: Final security analysis
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        if: always()
